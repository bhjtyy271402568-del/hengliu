<!doctype html><html><head><meta charset="utf-8">
<style>
:root{--ink:#16181C;--soft:#5A626C;--mute:#8A929B;--line:#D3D7DC;--or:#D9561A;--grey:#7D858E}
*{box-sizing:border-box;margin:0}
body{width:2400px;height:1500px;background:linear-gradient(180deg,#F5F6F8 0%,#ECEEF1 100%);color:var(--ink);
  font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif;position:relative;overflow:hidden}
.eyebrow{position:absolute;left:140px;top:96px;font-size:28px;font-weight:700;letter-spacing:6px;color:var(--or)}
h1{position:absolute;left:140px;top:140px;font-size:92px;font-weight:900;letter-spacing:2px;line-height:1.1}
.spec{position:absolute;right:140px;top:170px;font-size:30px;color:var(--soft);text-align:right;line-height:1.6}
.render{position:absolute;left:0;top:190px;width:2400px;height:1000px}
.cap{position:absolute;transform:translateX(-50%);text-align:center;white-space:nowrap}
.cap b{display:block;font-size:42px;font-weight:800;color:var(--or)}
.cap span{display:block;font-size:28px;color:var(--soft);margin-top:6px}
.band{position:absolute;left:140px;right:140px;top:1210px;display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--line)}
.c{padding:30px 40px 0;border-left:2px solid var(--line)}
.c:first-child{border-left:none;padding-left:0}
.c h3{font-size:26px;font-weight:500;color:var(--mute);letter-spacing:2px}
.c .us{font-size:68px;font-weight:900;color:var(--or);line-height:1.15;margin-top:6px}
.c .us small{font-size:34px;font-weight:700}
.c .them{font-size:28px;color:var(--grey);margin-top:2px}
.foot{position:absolute;left:140px;right:140px;bottom:44px;font-size:22px;color:var(--mute)}
</style></head><body>
<p class="eyebrow">CC-40 一体化激光电源</p>
<h1>体积缩小到约 1/3</h1>
<p class="spec">40 A 激光恒流<br>振镜 ±15 V · 控制卡 15 V</p>
<img class="render" src="cmp2.png" alt="">
<div class="cap" style="left:788px;top:1035px"><b>CC-40 一体机</b><span>一个机壳，一根电池线</span></div>
<div class="cap" style="left:1560px;top:1035px"><b style="color:#3E454D">原方案</b><span>恒流源 + 振镜电源 + 控制卡电源，三根 220 V</span></div>
<div class="band">
 <div class="c"><h3>体积</h3><p class="us">3.3 <small>L</small></p><p class="them">原方案约 10 L</p></div>
 <div class="c"><h3>占桌面</h3><p class="us">240 <small>cm²</small></p><p class="them">原方案约 1030 cm²</p></div>
 <div class="c"><h3>电源线</h3><p class="us">1 <small>根</small></p><p class="them">原方案 3 根，另有互连线</p></div>
 <div class="c"><h3>价格（样机估算）</h3><p class="us"><small>约 ¥</small>2,100</p><p class="them">比原方案略高，批量后下降</p></div>
</div>
<p class="foot">按同一比例绘制。原方案外形：恒流源按常见台式机 300 × 250 × 120 mm 估，开关电源按金升阳 LM150、明纬 LRS-50 外形。</p>
</body></html>
